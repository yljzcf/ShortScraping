<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>ShortScraping - 局域网时间线</title>
  <link rel="icon" href="/assets/icons/icon48.png">
  <link rel="stylesheet" href="/public/share.css">
</head>
<body>
  <div class="app">
    <!-- 头部：站点切换（只读浏览，无刷新/翻译/设置按钮） -->
    <header class="header">
      <!-- 分组折叠标签条：内容由 shared/site-tabs.js 按 site-registry.js 的
           SITE_GROUPS 动态渲染（同一时间只展开一组），不要在这里手写按钮 -->
      <div class="category-tabs" id="categoryTabs" role="tablist" aria-label="站点分类"></div>
      <div class="header-actions">
        <span class="live-dot" id="liveDot" role="img" title="实时连接状态" aria-label="实时连接状态"></span>
      </div>
    </header>

    <!-- 内容区域 -->
    <main class="content">
      <div class="timeline-container"></div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">📺</div>
        <h3>暂无监控数据</h3>
        <p>该分类下还没有数据；请在主机的扩展中完成抓取后再来查看</p>
      </div>
    </main>

    <!-- 底部统计 -->
    <footer class="footer">
      <div class="status">
        <span class="status-dot"></span>
        <span id="statusText" aria-live="polite">连接中…</span>
      </div>
      <div class="stats">
        <span id="statsTotal">0 部</span>
        <span class="divider">|</span>
        <span id="statsLastUpdate">未更新</span>
      </div>
    </footer>
  </div>

  <script src="/shared/site-registry.js"></script>
  <script src="/shared/site-tabs.js"></script>
  <script src="/shared/timeline-render.js"></script>
  <script src="/public/share.js"></script>
</body>
</html>
