<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShortScraping - 短剧监控</title>
  <!-- 与局域网共享页共用的卡片/标签条样式须排在 popup.css 之前：同特异度时以弹窗自己的规则为准 -->
  <link rel="stylesheet" href="../shared/timeline-cards.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- 头部导航 -->
    <header class="header">
      <!-- 分组折叠标签条：内容由 shared/site-tabs.js 按 site-registry.js 的
           SITE_GROUPS 动态渲染（同一时间只展开一组），不要在这里手写按钮 -->
      <div class="category-tabs" id="categoryTabs" role="tablist" aria-label="站点分类"></div>
      <!-- 搜索条（v1.8.2）：点放大镜后顶替标签条（.header.is-searching），回车 / 「搜索」出结果，
           Esc / × 取消；结果态下保留在头部显示当前词，可改词再搜 -->
      <div class="search-bar" id="searchBar" role="search">
        <input type="search" id="searchInput" class="search-input" placeholder="搜标题、简介、标签（中英文均可）" aria-label="搜索全库" autocomplete="off" spellcheck="false">
        <button type="button" id="btnSearchSubmit" class="search-submit">搜索</button>
        <button type="button" id="btnSearchCancel" class="btn-icon search-cancel" title="取消（Esc）" aria-label="取消搜索" data-icon="x"></button>
      </div>
      <div class="header-actions">
        <button id="btnSearch" class="btn-icon" title="搜索全库：标题、简介、标签，中英文均可" aria-label="搜索" data-icon="search"></button>
        <!-- 显示语言（v1.8.12）：文字与悬停提示由 popup.js 按当前语言填（TimelineRender.LANG_LABELS） -->
        <button id="btnLang" class="btn-lang" type="button" aria-label="切换显示语言（中文 / 英文）">中</button>
        <button id="btnTranslateAll" class="btn-icon" title="全部翻译：检查所有待翻译条目并开始翻译" aria-label="全部翻译" data-icon="language"></button>
        <button id="btnSettings" class="btn-icon" title="设置" aria-label="设置" data-icon="settings"></button>
      </div>
    </header>

    <!-- 状态栏：左侧同步服务胶囊，右侧版本胶囊。点胶囊重新检测（提示写在悬停 title 里）；
         📁 / 重启 / 停止只在悬停或键盘聚焦同步胶囊时出现，「启动」在服务关闭时常显 -->
    <section class="status-bar">
      <div class="sync-service status-pill" id="syncServiceStatus" role="button" tabindex="0" title="正在检测本地 CSV 同步服务">
        <span class="sync-service-dot" aria-hidden="true"></span>
        <span id="syncServiceText">同步服务：检测中</span>
        <span class="sync-tools">
          <button id="btnSyncFolder" class="sync-inline-btn" title="打开同步服务脚本所在文件夹（需先注册一键集成：Windows 运行 server/setup-launcher.bat，macOS 运行 server/setup-autostart.command；未注册时复制路径）" aria-label="打开同步服务文件夹" data-icon="folder"></button>
          <button id="btnSyncRestart" class="sync-inline-btn hidden" title="重启同步服务" aria-label="重启同步服务" data-icon="refresh"></button>
          <button id="btnSyncStop" class="sync-inline-btn hidden" title="停止同步服务" aria-label="停止同步服务" data-icon="stop"></button>
        </span>
        <button id="btnSyncStart" class="sync-inline-btn sync-start-btn hidden" title="一键启动同步服务（需先注册一键集成：Windows 运行 server/setup-launcher.bat，macOS 运行 server/setup-autostart.command）" data-icon="play">启动</button>
      </div>
      <div class="version-status status-pill" id="versionStatus" role="button" tabindex="0" title="正在检查远端版本">
        <span class="version-status-dot" aria-hidden="true"></span>
        <span id="versionStatusText">版本：检查中</span>
      </div>
      <!-- 临时提示条：绝对定位悬浮于状态栏正下方，刷新结果/操作提示，自动消失 -->
      <div id="toastBar" class="toast-bar hidden" aria-live="polite"></div>
    </section>

    <!-- 内容区域 -->
    <main class="content">
      <!-- 搜索结果条（v1.8.2）：只在结果态显示，「关闭搜索」回到站点时间线 -->
      <div id="searchResultBar" class="search-result-bar hidden">
        <span id="searchResultText" class="search-result-text"></span>
        <button type="button" id="btnSearchClose" class="search-close">关闭搜索</button>
      </div>

      <!-- 时间线（由 shared/timeline-render.js 动态生成） -->
      <div class="timeline-container"></div>

      <!-- 空状态 -->
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon" data-icon="tv" aria-hidden="true"></div>
        <h3 id="emptyTitle">暂无监控数据</h3>
        <p id="emptyDesc">该分类下还没有数据，请先访问对应榜单页面并点击抓取按钮</p>
        <button id="btnGoScrape" class="btn-primary">前往榜单页面</button>
      </div>

      <!-- 加载状态 -->
      <div id="loadingState" class="loading-state hidden">
        <div class="spinner"></div>
        <p>正在加载数据...</p>
      </div>
    </main>

    <!-- 底部状态栏：左侧全库条数与翻译状态（抓取异常时多一枚警告图标），右侧局域网。
         「抓取于 …」不常驻：打开弹窗时在顶部提示条里弹一下（popup.js showLastUpdateToast） -->
    <footer class="footer">
      <div class="status">
        <span class="status-dot"></span>
        <span id="statsTotal">共 0 部</span>
        <span class="divider" aria-hidden="true">·</span>
        <span id="statusText">就绪</span>
        <button id="scrapeAlert" class="scrape-alert hidden" aria-label="抓取异常，点击查看" data-icon="alert"></button>
      </div>
      <div class="lan-share" id="lanShare" role="button" tabindex="0" aria-haspopup="dialog" title="局域网共享">
        <span class="lan-share-icon" aria-hidden="true" data-icon="wifi"></span>
        <span id="lanShareText">局域网</span>
      </div>
    </footer>

    <!-- 局域网浮层：点底栏「局域网」开合；二维码给手机扫，点地址复制 -->
    <div id="lanQrPopover" class="lan-qr-popover hidden" role="dialog" aria-label="局域网共享二维码与地址" tabindex="-1">
      <canvas id="lanQrCanvas" width="0" height="0"></canvas>
      <button type="button" class="lan-qr-url" id="lanQrUrl" title="点击复制局域网地址"></button>
      <div class="lan-qr-hint">手机扫码打开 · 点地址复制</div>
    </div>
  </div>

  <!-- 线条图标：载入即在 DOMContentLoaded 时填好上面的 data-icon 占位；timeline-render 画卡片时也要用 -->
  <script src="../shared/icons.js"></script>
  <script src="../shared/url-match.js"></script>
  <!-- 订阅 URL 清单（configuredScrapeUrls）与归属判定（dramasUnderUrls）与后台/设置页共用，依赖 url-match，须排在它之后 -->
  <script src="../shared/subscription-config.js"></script>
  <script src="../shared/site-registry.js"></script>
  <script src="../shared/site-tabs.js"></script>
  <!-- timeline-render 的标题文案取自 translate-config.titleDisplay，须排在它之前 -->
  <!-- IMDb 日期窗口天数的默认值与归一（「去抓取」打开 IMDb 订阅页时补日期，与后台同一口径） -->
  <script src="../shared/schedule-config.js"></script>
  <script src="../shared/translate-config.js"></script>
  <!-- 中文类型标签体系（v1.8.12）：卡片的中文标签与搜索都用它，须排在 timeline-render、drama-search 之前 -->
  <script src="../shared/genre-taxonomy.js"></script>
  <script src="../shared/timeline-render.js"></script>
  <!-- 搜索匹配判据（纯函数，v1.8.2） -->
  <script src="../shared/drama-search.js"></script>
  <script src="../shared/qrcode.js"></script>
  <script src="popup.js"></script>
</body>
</html>
